<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f5f2ec" />
    <meta name="description" content="PDFを見開きとページめくりで確認できる、ブラウザー内の冊子プレビュー。" />
    <title>Folio — 冊子プレビュー</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="app" id="app">
      <header class="topbar">
        <div class="brand" aria-label="Folio 冊子プレビュー">
          <span class="brand-mark" aria-hidden="true"><span></span><span></span></span>
          <span class="brand-name">Folio</span>
          <span class="brand-sub">冊子プレビュー</span>
        </div>
        <div class="topbar-actions">
          <span class="privacy-note" id="privacyNote">PDFはこのブラウザー内で開きます</span>
          <button class="icon-button search-toggle" id="searchToggle" type="button" aria-label="文字を検索" title="文字を検索" disabled>
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.8" cy="10.8" r="6.8"/><path d="m16 16 5 5"/></svg>
          </button>
          <button class="upload-button" id="uploadButton" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 16V3m0 0L7 8m5-5 5 5M4 16v3a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-3"/></svg><span>PDFを開く</span></button>
          <input id="fileInput" type="file" accept="application/pdf,.pdf" hidden />
        </div>
      </header>

      <main class="workspace" id="workspace">
        <div class="workspace-head" id="workspaceHead" hidden>
          <div class="document-info">
            <span class="eyebrow">READING PREVIEW</span>
            <h1 id="documentName">冊子</h1>
            <p id="documentMeta">1ページ</p>
          </div>
          <div class="view-actions">
            <span class="view-label" id="spreadLabel">表紙 · 1ページ</span>
            <span class="action-divider" aria-hidden="true"></span>
            <button class="icon-button" id="zoomOut" type="button" aria-label="縮小" title="縮小"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14"/></svg></button>
            <span class="zoom-value" id="zoomValue">100%</span>
            <button class="icon-button" id="zoomIn" type="button" aria-label="拡大" title="拡大"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M12 5v14"/></svg></button>
            <button class="fit-button" id="zoomFit" type="button">全体表示</button>
          </div>
        </div>

        <section class="reader" id="reader" aria-label="冊子プレビュー">
          <div class="empty-state" id="emptyState">
            <div class="empty-illustration" aria-hidden="true"><span class="empty-page left"></span><span class="empty-page right"></span><span class="empty-shadow"></span></div>
            <span class="eyebrow">YOUR BOOKLET, BEFORE PRINT</span>
            <h1>ページをめくって、<br />仕上がりを確かめる。</h1>
            <p>閲覧順のPDFを選ぶと、表紙・見開き・裏表紙を冊子のように表示します。</p>
            <button class="primary-button" id="emptyUpload" type="button">PDFを選択 <span aria-hidden="true">↗</span></button>
            <span class="empty-hint">ドラッグ＆ドロップにも対応</span>
          </div>
          <div class="reader-viewport" id="readerViewport" hidden>
            <div class="zoom-shell" id="zoomShell"><div class="book-surface" id="bookSurface"></div></div>
          </div>
          <div class="drop-overlay" id="dropOverlay" hidden><span>ここにPDFをドロップ</span></div>
          <div class="loading-overlay" id="loadingOverlay" hidden><span class="spinner"></span><span id="loadingText">PDFを読み込み中…</span></div>
          <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
        </section>

        <nav class="pagination" id="pagination" aria-label="ページ移動" hidden>
          <button class="page-button" id="prevButton" type="button" aria-label="前の見開きへ"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 5-7 7 7 7"/></svg><span>戻る</span></button>
          <div class="scrubber">
            <div class="scrubber-top"><span>ページを移動</span><span id="positionLabel">1 / 1</span></div>
            <div class="range-wrap" id="rangeWrap">
              <input id="pageRange" type="range" min="0" max="0" value="0" step="1" aria-label="表示する見開きを選択" />
              <div class="range-tooltip" id="rangeTooltip" hidden>表紙 · 1ページ</div>
            </div>
          </div>
          <button class="page-button next" id="nextButton" type="button" aria-label="次の見開きへ"><span>進む</span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 5 7 7-7 7"/></svg></button>
        </nav>
      </main>

      <aside class="search-panel" id="searchPanel" aria-label="PDF内を検索" hidden>
        <div class="search-head"><div><span class="eyebrow">FIND IN DOCUMENT</span><h2>文字検索</h2></div><button class="icon-button" id="searchClose" type="button" aria-label="検索を閉じる"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 5 19 19M19 5 5 19"/></svg></button></div>
        <form id="searchForm" class="search-form"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.8" cy="10.8" r="6.8"/><path d="m16 16 5 5"/></svg><input id="searchInput" type="search" placeholder="単語や文章を入力" autocomplete="off" aria-label="検索語" /><button type="submit">検索</button></form>
        <p class="search-summary" id="searchSummary">PDF内の文字を検索できます。</p>
        <div class="search-results" id="searchResults"></div>
        <p class="search-note">画像だけのPDFは、OCR済みでない限り検索できません。</p>
      </aside>
    </div>
    <script type="module" src="./main.js"></script>
  </body>
</html>
